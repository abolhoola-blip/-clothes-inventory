<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مخزون الملابس</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f6f8;margin:0;padding:20px;color:#222}
.container{max-width:1000px;margin:auto}
h1{margin-bottom:20px}
.card{background:white;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #00000012}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
input,select,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:9px;font-size:15px}
button{background:#111;color:white;cursor:pointer;border:0}
button:hover{opacity:.9}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#f0f2f5;padding:12px 18px;border-radius:10px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:center}
.message{margin-top:10px;font-weight:bold;min-height:20px}
.small{color:#666;font-size:13px}
</style>
</head>
<body>
<div class="container">
<h1>📦 مخزون الملابس</h1>

<div class="card">
<h2>إضافة بضاعة</h2>
<div class="grid">
<input id="product" placeholder="اسم المنتج">
<input id="price" type="number" min="0" step="0.01" placeholder="السعر">
<input id="color" placeholder="اللون">
<input id="size" placeholder="المقاس">
<input id="qty" type="number" min="1" step="1" placeholder="الكمية">
<button id="addBtn" type="button">➕ إضافة بضاعة</button>
</div>
<div id="addMsg" class="message"></div>
</div>

<div class="card">
<h2>المخزون</h2>
<div class="stats">
<div class="stat">إجمالي القطع: <b id="total">0</b></div>
<div class="stat">عدد الأصناف: <b id="items">0</b></div>
</div>
<table>
<thead><tr><th>المنتج</th><th>السعر</th><th>اللون</th><th>المقاس</th><th>الكمية</th></tr></thead>
<tbody id="stockBody"></tbody>
</table>
<p id="empty" class="small">لا توجد بضاعة حاليًا.</p>
</div>

<div class="card">
<h2>العمليات</h2>
<div class="grid">
<select id="operation">
<option value="sale">بيع</option>
<option value="shipping">قيد التوصيل</option>
<option value="delivered">تم التوصيل</option>
<option value="cancel">إلغاء</option>
<option value="returned">راجع</option>
<option value="exchange">استبدال</option>
</select>
<select id="stockSelect"></select>
<input id="opQty" type="number" min="1" step="1" placeholder="الكمية">
<button id="opBtn" type="button">تنفيذ العملية</button>
</div>
<div id="opMsg" class="message"></div>
<p class="small">تم التوصيل ينقص المخزون، وراجع يزيد المخزون. البيع وقيد التوصيل والإلغاء لا يغيرون المخزون في هذه النسخة.</p>
</div>
</div>

<script>
(function(){
"use strict";
var KEY="clothes_stock_v2";
var stock=[];

function load(){
  try{ stock=JSON.parse(localStorage.getItem(KEY)||"[]"); if(!Array.isArray(stock)) stock=[]; }
  catch(e){ stock=[]; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(stock)); }

function render(){
  var body=document.getElementById("stockBody");
  var sel=document.getElementById("stockSelect");
  body.innerHTML="";
  sel.innerHTML="";
  var total=0;
  stock.forEach(function(x,i){
    total+=Number(x.qty)||0;
    var tr=document.createElement("tr");
    [x.product,x.price+" د.ل",x.color,x.size,x.qty].forEach(function(v){
      var td=document.createElement("td"); td.textContent=v; tr.appendChild(td);
    });
    body.appendChild(tr);
    var opt=document.createElement("option");
    opt.value=i;
    opt.textContent=x.product+" | "+x.color+" | "+x.size+" | الكمية: "+x.qty;
    sel.appendChild(opt);
  });
  document.getElementById("total").textContent=total;
  document.getElementById("items").textContent=stock.length;
  document.getElementById("empty").style.display=stock.length?"none":"block";
}

document.getElementById("addBtn").addEventListener("click",function(){
  var product=document.getElementById("product").value.trim();
  var price=document.getElementById("price").value;
  var color=document.getElementById("color").value.trim();
  var size=document.getElementById("size").value.trim();
  var qty=parseInt(document.getElementById("qty").value,10);
  var msg=document.getElementById("addMsg");

  if(!product || price==="" || !color || !size || !Number.isInteger(qty) || qty<1){
    msg.textContent="⚠️ عبّي اسم المنتج والسعر واللون والمقاس والكمية.";
    return;
  }

  var found=stock.find(function(x){
    return x.product===product && String(x.price)===String(Number(price)) &&
           x.color===color && x.size===size;
  });
  if(found) found.qty += qty;
  else stock.push({product:product,price:Number(price),color:color,size:size,qty:qty});
  save(); render();

  document.getElementById("product").value="";
  document.getElementById("price").value="";
  document.getElementById("color").value="";
  document.getElementById("size").value="";
  document.getElementById("qty").value="";
  msg.textContent="✅ تمت إضافة البضاعة بنجاح.";
});

document.getElementById("opBtn").addEventListener("click",function(){
  var msg=document.getElementById("opMsg");
  var i=parseInt(document.getElementById("stockSelect").value,10);
  var qty=parseInt(document.getElementById("opQty").value,10);
  var op=document.getElementById("operation").value;

  if(!Number.isInteger(i) || !stock[i]){msg.textContent="⚠️ أضف بضاعة أولًا.";return;}
  if(!Number.isInteger(qty)||qty<1){msg.textContent="⚠️ اكتب كمية صحيحة.";return;}

  if(op==="delivered"){
    if(stock[i].qty<qty){msg.textContent="⚠️ الكمية الموجودة غير كافية.";return;}
    stock[i].qty-=qty;
  } else if(op==="returned"){
    stock[i].qty+=qty;
  } else {
    msg.textContent="✅ تم تسجيل العملية. لا يوجد تغيير في المخزون لهذه الحالة.";
    document.getElementById("opQty").value="";
    return;
  }
  if(stock[i].qty===0) stock.splice(i,1);
  save(); render();
  document.getElementById("opQty").value="";
  msg.textContent="✅ تمت العملية وتحديث المخزون.";
});

load(); render();
})();
</script>
</body>
</html>
